from IPython.display import HTML

HTML("""
<video id="video" width="320" height="240" autoplay muted playsinline style="border:1px solid #ccc;"></video>
<canvas id="canvas" width="320" height="240" style="border:1px solid #ccc;"></canvas>
<br>
<button id="start">Encender cámara</button>
<button id="stop">Apagar cámara</button>

<script src="https://docs.opencv.org/4.8.0/opencv.js" id="cv-script"></script>

<script>
/* 2. Esperamos a que OpenCV esté listo */
document.getElementById('cv-script').onload = function() {
    console.log('OpenCV cargado correctamente');
};

let streaming = false;
let stream = null;
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

document.getElementById('start').onclick = async () => {
    if (streaming) return;
    try {
        stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        video.srcObject = stream;
        streaming = true;
        processFrame();
    } catch (e) {
        alert('Cámara no disponible: ' + e);
    }
};

document.getElementById('stop').onclick = () => {
    if (stream) {
        stream.getTracks().forEach(t => t.stop());
        streaming = false;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
};

function processFrame() {
    if (!streaming) return;

    // Dibujamos el video en el canvas para que OpenCV pueda leerlo
    ctx.drawImage(video, 0, 0, 320, 240);

    // 3. Procesamiento con OpenCV
    try {
        let src = cv.imread(canvas);
        let gray = new cv.Mat();
        let edges = new cv.Mat();

        // Conversión a gris y detección de bordes Canny
        cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
        cv.Canny(gray, edges, 50, 150);

        // Mostramos el resultado en el mismo canvas
        cv.imshow(canvas, edges);

        // Liberación de memoria (Crucial en JS)
        src.delete();
        gray.delete();
        edges.delete();
    } catch (err) {
        console.error("Error en OpenCV:", err);
    }

    // Siguiente cuadro
    requestAnimationFrame(processFrame);
}
</script>
""")
